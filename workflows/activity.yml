name: Activity graphs

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-graphs
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIVITY_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Count commits and draw the graphs
        run: node profile/scripts/activity.mjs
        env:
          ORG: incordai
          OUT_DIR: profile/assets
          AUTHORS: blockmandev,ravikaashg,noreply@anthropic.com
          EXCLUDE: .github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the graphs if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/assets/activity-*.svg profile/assets/repos-*.svg
          if git diff --cached --quiet; then
            echo "Graphs unchanged."
          else
            git commit -m "Update activity graphs"
            git push
          fi
