name: Activity graphs

# Redraws the activity graphs on github.com/incordai once a day.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-graphs
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Count commits and draw the graphs
        run: node scripts/activity.mjs
        env:
          ORG: incordai
          OUT_DIR: assets
          # Only these authors count, so history inherited from upstream projects
          # (Burn in cortex, MonoCode in Watchman, Inbrowse's origin) stays out.
          # Add teammates' GitHub usernames or emails here.
          AUTHORS: blockmandev,ravikaashg,noreply@anthropic.com
          # The profile repository itself is not product work.
          EXCLUDE: .github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the graphs if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg assets/repos-*.svg
          if git diff --cached --quiet; then
            echo "Graphs unchanged."
          else
            git commit -m "Update activity graphs"
            git push
          fi
